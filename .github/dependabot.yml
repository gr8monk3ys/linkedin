version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Same-owner reusable workflows live in the PRIVATE gr8monk3ys/github
      # repo; Dependabot cannot reach it (git_dependencies_not_reachable)
      # and fails every weekly run. They are pinned manually, not versioned.
      - dependency-name: "gr8monk3ys/*"
    open-pull-requests-limit: 2
    groups:
      github_actions_updates:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # uv VERSION updates stay disabled (limit 0) — this repo has never had
  # them and enabling them now would ADD PRs, not remove them. The block
  # exists solely so Dependabot SECURITY updates, which ignore this file
  # unless their ecosystem is declared, can be batched into one PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
