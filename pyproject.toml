[project]
name = "linkedin"
version = "2.0.0"
description = "LinkedIn Job Hunt Assistant - CLI + Automation tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lorenzo Scaturchio", email = "lorenzo@example.com" }
]
keywords = ["linkedin", "cli", "automation", "social-media", "job-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "anthropic>=0.40.0",
    "sqlmodel>=0.0.14",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0",
]
automation = [
    "playwright>=1.40.0",
    "keyring>=24.0.0",
]
web = [
    "reflex>=0.6.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
linkedin = "linkedin.cli:cli"
linkedin-cli = "linkedin.cli:cli"
linkedin-web = "linkedin.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin", "src/linkedin_web"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["src/linkedin/automation/", "src/linkedin/migrations/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Allow longer lines in CLI with rich formatting

[tool.pytest.ini_options]
testpaths = ["tests"]
